<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baby Feeding Tracker</title>

<style>
:root{
    --pink-50:#fff8fa;
    --pink-100:#fff0f4;
    --pink-200:#ffdce7;
    --pink-300:#ffc3d5;
    --pink-400:#ef9db8;
    --pink-500:#dc7197;
    --pink-700:#a84265;
    --ink:#35232b;
    --muted:#8f6f7b;
    --line:#f1d7df;
    --success:#2f9d68;
    --danger:#d95d73;
    --shadow:0 12px 35px rgba(172,81,112,.12);
}

*{ box-sizing:border-box; }

html, body{
    margin:0;
    min-height:100vh;
    width:100%;
    overflow-x:hidden;
    font-family:Arial,sans-serif;
    color:var(--ink);
    background:
        radial-gradient(circle at 15px 15px,rgba(255,195,213,.38) 0 5px,transparent 6px),
        linear-gradient(135deg,#fff 0%,#fff7fa 48%,#fff 100%);
    background-size:55px 55px,auto;
}

button,input,select{ font:inherit; }

.app{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:10px 8px 24px;
}

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:10px;
}

.topbar-left{
    display:flex;
    align-items:center;
    gap:8px;
    flex:none;
}

.icon-btn{
    width:40px;
    height:40px;
    flex:none;
    display:grid;
    place-items:center;
    border:1px solid var(--line);
    border-radius:12px;
    background:rgba(255,255,255,.9);
    color:var(--pink-700);
    cursor:pointer;
    box-shadow:0 4px 14px rgba(172,81,112,.08);
    transition:.2s;
}

.icon-btn:hover{
    transform:translateY(-2px);
    background:var(--pink-50);
}

.brand{
    flex:1;
    text-align:center;
    padding:10px;
    border-radius:16px;
    background:rgba(255,255,255,.88);
    box-shadow:var(--shadow);
}

.brand h1{
    margin:0;
    font-size:clamp(17px,4vw,27px);
    color:var(--pink-700);
}

.card{
    width:100%;
    background:rgba(255,255,255,.94);
    border:1px solid rgba(241,215,223,.85);
    border-radius:18px;
    box-shadow:var(--shadow);
    overflow:hidden;
}

.page-meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    padding:10px;
    border-bottom:1px solid var(--line);
}

.date-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:7px 9px;
    color:var(--pink-700);
    font-weight:700;
    font-size:12px;
}

.page-info{
    color:var(--muted);
    font-size:11px;
    text-align:right;
}

/* TABLE */
.table-wrap{
    width:100%;
    overflow:hidden;
}

table{
    width:100%;
    table-layout:fixed;
    border-collapse:collapse;
    border:1px solid var(--line);
}

th:nth-child(1), td:nth-child(1){ width:8%; }
th:nth-child(2), td:nth-child(2){ width:28%; }
th:nth-child(3), td:nth-child(3){ width:12%; }
th:nth-child(4), td:nth-child(4){ width:26%; }
th:nth-child(5), td:nth-child(5){ width:26%; }

th{
    padding:7px 2px;
    background:var(--pink-100);
    color:var(--pink-700);
    font-size:11px;
    line-height:1.25;
    word-break:break-word;
    text-align:center;
    vertical-align:middle;
    border:1px solid var(--line);
}

td{
    padding:6px 2px;
    text-align:center;
    vertical-align:middle;
    font-size:11px;
    overflow:hidden;
    border:1px solid var(--line);
}

tbody tr{ transition:.18s; }
tbody tr:hover{ background:#fffafd; }

select{
    width:100%;
    min-width:0;
    max-width:100%;
    padding:7px 2px;
    border:1px solid var(--pink-300);
    border-radius:8px;
    color:var(--ink);
    background-color:#fff;
    cursor:pointer;
    font-size:11px;
    text-align:center;
}

select:focus,input:focus{
    outline:none;
    border-color:var(--pink-500);
    box-shadow:0 0 0 3px rgba(220,113,151,.15);
}

.check{
    width:17px;
    height:17px;
    accent-color:var(--pink-500);
    cursor:pointer;
}

.time-box{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
}

.manual-time{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:1px;
    padding:3px;
    border:1px solid var(--pink-200);
    border-radius:8px;
    background:var(--pink-50);
}

.manual-time select{
    min-width:0;
    width:30%;
    padding:3px 0;
    border:0;
    background:transparent;
    font-size:10px;
}

.time-value{
    font-weight:700;
    color:var(--pink-700);
    white-space:normal;
    word-break:break-word;
    font-size:11px;
}

.feeding-cell{
    padding:5px 3px;
}

.feeding-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    width:100%;
}

.feeding-controls .milk-select{
    flex:1 1 55%;
}

.feeding-controls .diaper-select{
    flex:1 1 35%;
}

.feeding-controls .check-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 22px;
}

.feeding-controls.medicine-mode .diaper-select,
.feeding-controls.medicine-mode .check-wrap{
    display:none;
}

.feeding-controls.medicine-mode .milk-select{
    flex:1 1 100%;
}

@media(max-width:600px){
    .feeding-cell{
        padding:4px 2px;
    }

    .feeding-controls{
        gap:3px;
    }

    .feeding-controls .check-wrap{
        flex-basis:18px;
    }
}

.btn{
    border:0;
    border-radius:9px;
    padding:8px 9px;
    cursor:pointer;
    font-weight:700;
    transition:.2s;
    font-size:11px;
    text-align:center;
}

.btn:hover{ transform:translateY(-2px); }
.btn:active{ transform:translateY(0); }

.btn-primary{
    background:linear-gradient(135deg,var(--pink-500),var(--pink-400));
    color:white;
    box-shadow:0 7px 16px rgba(220,113,151,.24);
}

.btn-soft{
    background:var(--pink-100);
    color:var(--pink-700);
}

.btn-danger{
    background:#fff1f3;
    color:var(--danger);
}

.btn-small{
    padding:5px 4px;
    font-size:9px;
    line-height:1.2;
}

.time-box .btn-small{ width:100%; }

/* ADD ROW BUTTON */
.add-row-area{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:8px 10px 4px;
    width: 100%;
}

.add-row-btn{
    min-width:42px !important;
    width:100%;
    height:34px;
    padding:4px !important;
    font-size:20px !important;
    line-height:1;
}

@media(max-width:100%){
    .add-row-area{
        padding:7px 7px 3px;
        width: 100%;
    }

    .add-row-btn{
        width:100%;
        min-width:38px !important;
        height:32px;
        font-size:19px !important;
    }
}

/* ROW SELECTION */
tbody tr{
    transition:background .18s, box-shadow .18s;
    cursor:pointer;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
}

tbody tr:hover{
    background:#fffafd;
}

tbody tr.selected-row{
    background:var(--pink-100);
    box-shadow:inset 4px 0 0 var(--pink-500);
}

tbody tr.selected-row td:first-child{
    color:var(--pink-700);
    font-weight:900;
}

.selection-toolbar{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:8px 10px;
    border-top:1px solid var(--line);
    background:linear-gradient(180deg,#fff9fb,#fff);
}

.selection-toolbar.show{
    display:flex;
}

.selection-info{
    color:var(--pink-700);
    font-size:10px;
    font-weight:800;
    line-height:1.25;
}

.selection-actions{
    display:flex;
    align-items:center;
    gap:6px;
}

.selection-actions .btn{
    min-width:78px;
}

@media(max-width:600px){
    .selection-toolbar{
        padding:7px;
        gap:5px;
    }

    .selection-info{
        font-size:9px;
    }

    .selection-actions{
        gap:4px;
    }

    .selection-actions .btn{
        min-width:65px;
        padding:6px 4px;
        font-size:9px;
    }
}

.summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    padding:10px;
    border-top:1px solid var(--line);
    background:linear-gradient(180deg,#fff,#fff9fb);
}

.summary-item{
    padding:9px;
    border:1px solid var(--line);
    border-radius:12px;
    background:white;
}

.summary-label{
    display:block;
    color:var(--muted);
    font-size:10px;
    margin-bottom:4px;
}

.summary-value{
    font-size:15px;
    font-weight:800;
}

/* MILK GOAL STATUS */
.milkTotal{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    min-width:78px;
    min-height:46px;
    padding:7px 10px;
    border:3px solid var(--danger);
    border-radius:50%;
}

.milkTotal::before{
    content:"✕";
    font-size:17px;
    font-weight:900;
    line-height:1;
}

.milkTotal.status-success{
    color:var(--success);
    border-color:var(--success);
    animation:milkSuccessPulse 1.5s ease-in-out infinite;
}

.milkTotal.status-success::before{
    content:"✓";
}

.milkTotal.status-warning{
    color:var(--danger);
    border-color:var(--danger);
    animation:milkWarningPulse 1s ease-in-out infinite;
}

@keyframes milkSuccessPulse{
    0%,100%{
        transform:scale(1);
        box-shadow:0 0 0 0 rgba(47,157,104,.35);
    }
    50%{
        transform:scale(1.06);
        box-shadow:0 0 0 8px rgba(47,157,104,0);
    }
}

@keyframes milkWarningPulse{
    0%,100%{
        transform:scale(1);
        box-shadow:0 0 0 0 rgba(217,93,115,.40);
    }
    50%{
        transform:scale(1.08);
        box-shadow:0 0 0 10px rgba(217,93,115,0);
    }
}

@media(prefers-reduced-motion:reduce){
    .milkTotal{
        animation:none !important;
    }
}

/* TEMPERATURE */
.temperature-card{
    margin-top:10px;
}

.temperature-section{
    padding:10px;
    border-top:1px solid var(--line);
    background:linear-gradient(180deg,#fff,#fff9fb);
}

.temperature-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    margin-bottom:8px;
}

.temperature-select{
    flex:1;
    max-width:210px;
    padding:9px 8px;
    border:1px solid var(--pink-300);
    border-radius:10px;
    background:#fff;
    color:var(--ink);
    font-size:11px;
    text-align:center;
}

.temperature-add-btn{
    flex:0 0 auto;
}

.temperature-box{
    min-height:40px;
    max-height:220px;
    overflow-y:auto;
    padding:4px 2px;
    background:transparent;
}

.temperature-empty{
    text-align:center;
    color:var(--muted);
    font-size:10px;
    padding:10px 5px;
}

.temperature-entry{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:7px 2px;
    margin-bottom:2px;
    background:transparent;
}

.temperature-entry:last-child{
    margin-bottom:0;
}

.temperature-value{
    color:var(--success);
    font-weight:800;
    font-size:13px;
}

.temperature-value.temperature-high{
    color:var(--danger);
}

.temperature-time{
    color:var(--muted);
    font-size:10px;
    text-align:right;
}

@media(max-width:600px){
    .temperature-controls{
        gap:5px;
    }

    .temperature-select{
        max-width:none;
        font-size:10px;
        padding:8px 4px;
    }

    .temperature-entry{
        padding:7px;
    }

    .temperature-value{
        font-size:12px;
    }

    .temperature-time{
        font-size:9px;
    }
}

.status-success{ color:var(--success); }
.status-warning{ color:var(--danger); }

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:6px;
    padding:12px 0 0;
}

.controls .btn{
    flex:1;
    min-width:90px;
}

/* PAST-DATE LOCKING */
.page.past-date-locked input,
.page.past-date-locked select,
.page.past-date-locked button{
    pointer-events:none;
    cursor:not-allowed !important;
    opacity:.62;
}

.page.past-date-locked .temperature-add-btn{
    display:none;
}

.btn:disabled{
    opacity:.45 !important;
    cursor:not-allowed !important;
    transform:none !important;
    box-shadow:none;
}

@media(max-width:600px){
    .app{ padding:6px 4px 18px; }
    .topbar{ gap:5px; margin-bottom:7px; }

    .topbar-left{
        gap:5px;
    }

    .icon-btn{
        width:34px;
        height:34px;
        border-radius:10px;
    }

    .brand{ padding:8px 4px; }
    .brand h1{ font-size:16px; }
    .card{ border-radius:13px; }
    .page-meta{ padding:7px; }

    .date-badge{
        padding:6px 7px;
        font-size:10px;
    }

    .page-info{ font-size:9px; }

    th{
        padding:6px 1px;
        font-size:9px;
        border:1px solid var(--line);
    }

    td{
        padding:5px 1px;
        font-size:9px;
        border:1px solid var(--line);
    }

    select{
        padding:5px 0;
        font-size:9px;
        border-radius:6px;
    }

    .check{
        width:15px;
        height:15px;
    }

    .btn{
        font-size:10px;
        padding:7px 5px;
    }

    .btn-small{
        font-size:8px;
        padding:4px 2px;
    }

    .manual-time{ padding:2px; }

    .manual-time select{
        font-size:8px;
        padding:2px 0;
    }

    .time-value{ font-size:9px; }
    .time-box{ gap:3px; }

    .summary{
        gap:5px;
        padding:7px;
    }

    .summary-item{
        padding:7px 5px;
        border-radius:9px;
    }

    .summary-label{ font-size:9px; }
    .summary-value{ font-size:12px; }

    .controls{
        gap:5px;
        padding-top:9px;
    }

    .controls .btn{
        min-width:0;
        padding:8px 4px;
    }
}

/* Firebase login */
.auth-overlay{
    position:fixed; inset:0; z-index:99999; display:none;
    align-items:center; justify-content:center; padding:18px;
    background:rgba(53,35,43,.45); backdrop-filter:blur(4px);
}
.auth-overlay.show{display:flex;}
.auth-box{
    width:min(390px,100%); background:#fff; border:1px solid var(--line);
    border-radius:20px; padding:20px; box-shadow:0 20px 60px rgba(80,30,50,.25);
}
.auth-box h2{margin:0 0 6px;text-align:center;color:var(--pink-700);font-size:21px;}
.auth-box p{margin:0 0 14px;text-align:center;color:var(--muted);font-size:12px;}
.auth-box label{display:block;margin:9px 0 5px;color:var(--pink-700);font-size:11px;font-weight:700;}
.auth-box input{
    width:100%;padding:10px;border:1px solid var(--pink-300);
    border-radius:10px;background:#fff;box-sizing:border-box;
}
.auth-actions{display:flex;gap:7px;margin-top:14px;}
.auth-actions .btn{flex:1;}
.auth-error{min-height:18px;margin-top:8px;color:var(--danger);font-size:11px;text-align:center;}
.firebase-status{text-align:center;color:var(--muted);font-size:10px;padding:5px 10px;}
.firebase-status.error{color:var(--danger);}
.auth-badge{
    position:fixed;right:10px;bottom:10px;z-index:9998;display:none;
    padding:7px 10px;border:1px solid var(--line);border-radius:12px;
    background:rgba(255,255,255,.96);color:var(--pink-700);
    font-size:10px;box-shadow:var(--shadow);cursor:pointer;
}
.auth-badge.show{display:block;}

</style>

</head>

<body>
<main class="app">

    <div class="topbar">
        <div class="topbar-left">
            <button class="icon-btn" id="fullscreenBtn" title="Fullscreen" aria-label="Fullscreen">⛶</button>

        </div>

        <div class="brand">
            <h1>Baby Feeding Tracker ✨ <br> 婴儿喂养追踪器</h1>
        </div>

        <button class="icon-btn" id="deletePageBtn" title="Delete / Clear current page" aria-label="Delete or clear current page">🗑</button>
    </div>

    <div class="firebase-status" id="firebaseStatus">☁️ Connecting to Firebase...</div>

    <section class="card">
        <div id="pages"></div>
    </section>

    <section class="card temperature-card">
        <div class="temperature-section">
            <div class="temperature-controls">
                <select class="temperature-select" aria-label="Temperature">
                    <option value="">🌡️ Select temperature / 选择体温</option>
                </select>
                <button class="btn btn-primary temperature-add-btn" type="button">
                    ＋ Add Temperature<br>添加体温
                </button>
            </div>
            <div class="temperature-box">
                <div class="temperature-empty">No temperature recorded yet. / 尚未记录体温。</div>
            </div>
        </div>
    </section>

    <div class="controls">
        <button class="btn btn-soft" id="prevPageBtn">← Previous<br>上一页</button>
        <button class="btn btn-soft" id="nextPageBtn">Next →<br>下一页</button>
        <button class="btn btn-soft" id="lastPageBtn">Last →|<br>最后一页</button>
    </div>

</main>

<div class="auth-overlay" id="authOverlay">
  <div class="auth-box">
    <h2>🔐 Login Required</h2>
    <p>Please log in to make changes to the tracker.</p>
    <label for="authUsername">Username</label>
    <input id="authUsername" type="text" autocomplete="username" placeholder="....">
    <label for="authPassword">Password</label>
    <input id="authPassword" type="password" autocomplete="current-password" placeholder="....">
    <div class="auth-error" id="authError"></div>
    <div class="auth-actions">
      <button class="btn btn-soft" id="authCancelBtn">Cancel</button>
      <button class="btn btn-primary" id="authLoginBtn">Login</button>
    </div>
  </div>
</div>
<div class="auth-badge" id="authBadge" title="Tap to sign out"></div>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyD-VGobD51rndQnp22hef9paZT3-V_uK8Q",
    authDomain: "baby-feeding-tracker-b2035.firebaseapp.com",
    projectId: "baby-feeding-tracker-b2035",
    storageBucket: "baby-feeding-tracker-b2035.firebasestorage.app",
    messagingSenderId: "7883630691",
    appId: "1:7883630691:web:4849ef386713ad66e3b056",
    measurementId: "G-Z3C6Q22RWC"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const trackerRef = doc(db, "babyTracker", "main");
const ADMIN_EMAIL = "admin@babyfeedingtracker.com";
let currentUser = null, pendingAction = null, applyingRemote = false, firebaseConnected = false;

const $ = selector => document.querySelector(selector);
function setFirebaseStatus(message,error=false){const el=$("#firebaseStatus");if(el){el.textContent=message;el.classList.toggle("error",error);}}
function isEditor(){return !!currentUser;}
function requireLogin(action){if(isEditor()){action();return;}pendingAction=action;$("#authUsername").value="";$("#authPassword").value="";$("#authError").textContent="";$("#authOverlay").classList.add("show");$("#authUsername").focus();}
function closeLogin(){$("#authOverlay").classList.remove("show");pendingAction=null;$("#authError").textContent="";}
async function login(){const username=$("#authUsername").value.trim(),password=$("#authPassword").value,error=$("#authError");if(!username||!password){error.textContent="Please enter username and password.";return;}const email=username.toLowerCase()==="admin"?ADMIN_EMAIL:username;try{$("#authLoginBtn").disabled=true;error.textContent="Signing in...";await signInWithEmailAndPassword(auth,email,password);$("#authOverlay").classList.remove("show");const action=pendingAction;pendingAction=null;if(action)action();}catch(err){console.error(err);error.textContent=err.code==="auth/invalid-credential"||err.code==="auth/wrong-password"||err.code==="auth/user-not-found"?"Incorrect username or password.":(err.message||"Login failed.");}finally{$("#authLoginBtn").disabled=false;}}
onAuthStateChanged(auth,user=>{
    currentUser=user||null;
    const badge=$("#authBadge");

    if(currentUser){
        badge.textContent="🔓 Admin editing mode";
        badge.classList.add("show");
        setFirebaseStatus("☁️ Firebase connected • Editing enabled");
    }else{
        badge.classList.remove("show");
        clearAllRowSelections();
        setFirebaseStatus(firebaseConnected?"☁️ Firebase connected • View only":"☁️ Connecting to Firebase...");
    }

    updateNavigation();
});

const MILK_OPTIONS = [60, 90, 120, 150];
const DIAPER_OPTIONS = ["Pee/尿尿", "Poop/大便"];

let pages = [];
let currentPage = 0;
let loadingData = false;

// Selected rows are kept only in the current browser view.
// They are not saved to Firebase.
const selectedRows = new Set();
let suppressRowClickUntil = 0;

function formatDate(date){
    return new Intl.DateTimeFormat("en-GB",{
        day:"2-digit", month:"2-digit", year:"numeric"
    }).format(date);
}

function dateKey(date){
    const d = new Date(date);
    d.setHours(0,0,0,0);

    // Store the calendar date without converting it to UTC.
    // This prevents Malaysia/Asia time from becoming the previous day.
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");

    return `${y}-${m}-${day}T00:00:00`;
}

function createSelect(options, value = ""){
    const select = document.createElement("select");

    options.forEach(item => {
        const option = document.createElement("option");
        option.value = String(item.value ?? item);
        option.textContent = item.label ?? item;
        select.appendChild(option);
    });

    if(value !== "") select.value = String(value);
    return select;
}

function createMilkSelect(value = "0", onChange = null){
    const options = [
        {label:"", value:"0"},
        ...MILK_OPTIONS.map(amount => ({
            label:`${amount} ML`,
            value:String(amount)
        })),
        {label:"Medicine / 药物", value:"medicine"},
        {label:"Type ML / 输入奶量", value:"custom"}
    ];

    const select = createSelect(options);
    select.className = "milk-select";

    const savedValue = String(value ?? "0");

    if([...select.options].some(option => option.value === savedValue)){
        select.value = savedValue;
    }else if(savedValue !== "custom" && savedValue !== "medicine" && !Number.isNaN(Number(savedValue))){
        addCustomMilkOption(select, savedValue);
        select.value = savedValue;
    }else{
        select.value = "0";
    }

    select.addEventListener("change", () => {
        const oldValue = String(value ?? "0");

        if(!isEditor()){
            select.value = oldValue;
            requireLogin(() => {
                if(select.value === "custom"){
                    const input = prompt("Enter milk amount in ML:\n请输入奶量（ML）：");
                    const amount = input === null ? null : Number(input.trim());

                    if(amount === null || input.trim() === "" || Number.isNaN(amount) || amount < 0){
                        select.value = "0";
                    }else{
                        addCustomMilkOption(select, String(amount));
                        select.value = String(amount);
                    }
                }

                if(onChange) onChange();
                refreshCurrentPage();
                saveData();
            });
            return;
        }

        if(select.value === "custom"){
            const input = prompt("Enter milk amount in ML:\n请输入奶量（ML）：");
            const amount = input === null ? null : Number(input.trim());

            if(amount === null || input.trim() === "" || Number.isNaN(amount) || amount < 0){
                select.value = "0";
            }else{
                addCustomMilkOption(select, String(amount));
                select.value = String(amount);
            }
        }

        if(onChange) onChange();
        refreshCurrentPage();
        saveData();
    });

    return select;
}

function addCustomMilkOption(select, amount){
    const exists = [...select.options].some(
        option => option.value === String(amount)
    );

    if(exists) return;

    const option = document.createElement("option");
    option.value = String(amount);
    option.textContent = `${amount} ML`;

    select.insertBefore(
        option,
        select.querySelector('option[value="custom"]')
    );
}

function updateFeedingMode(feedingControls, milkSelect){
    if(!feedingControls || !milkSelect) return;

    const isMedicine = milkSelect.value === "medicine";
    feedingControls.classList.toggle("medicine-mode", isMedicine);
}

function createFeedingControls(data = {}, onChange = null){
    const feedingControls = document.createElement("div");
    feedingControls.className = "feeding-controls";

    const checkWrap = document.createElement("span");
    checkWrap.className = "check-wrap";

    const burp = document.createElement("input");
    burp.type = "checkbox";
    burp.className = "check";
    burp.checked = Boolean(data.burp);

    burp.addEventListener("change", () => {
        if(!isEditor()){
            burp.checked = !burp.checked;
            requireLogin(() => {
                burp.checked = !burp.checked;
                if(onChange) onChange();
                saveData();
            });
            return;
        }

        if(onChange) onChange();
        saveData();
    });

    checkWrap.appendChild(burp);

    const milkSelect = createMilkSelect(data.milk ?? "0", () => {
        updateFeedingMode(feedingControls, milkSelect);

        if(milkSelect.value === "medicine"){
            diaperSelect.value = DIAPER_OPTIONS[0];
            burp.checked = false;
        }

        if(onChange) onChange();
    });

    const diaperSelect = createSelect(
        DIAPER_OPTIONS,
        data.diaper || DIAPER_OPTIONS[0]
    );
    diaperSelect.className = "diaper-select";

    diaperSelect.addEventListener("change", () => {
        if(!isEditor()){
            const oldValue = data.diaper || DIAPER_OPTIONS[0];
            diaperSelect.value = oldValue;
            requireLogin(() => {
                diaperSelect.value = oldValue;
                if(onChange) onChange();
                saveData();
            });
            return;
        }

        saveData();
    });

    return {

function createTimeControl(savedTime = ""){
    if(savedTime){
        return createLoggedTime(savedTime);
    }

    const container = document.createElement("div");
    container.className = "time-box";

    const logButton = document.createElement("button");
    logButton.className = "btn btn-primary btn-small";
    logButton.innerHTML = "Log Time<br>记录时间";

    logButton.addEventListener("click", () => {
        if(!isEditor()){
            requireLogin(() => logButton.click());
            return;
        }

        const time = new Date().toLocaleTimeString([],{
            hour:"numeric",
            minute:"2-digit",
            hour12:true
        });

        container.replaceWith(createLoggedTime(time));
        saveData();
    });

    const manual = document.createElement("div");
    manual.className = "manual-time";

    const hours = createSelect([
        {label:"HH", value:""},
        ...Array.from({length:12}, (_,i) => ({
            label:String(i + 1),
            value:String(i + 1)
        }))
    ]);

    const minutes = createSelect([
        {label:"MM", value:""},
        ...Array.from({length:60}, (_,i) => {
            const value = String(i).padStart(2,"0");
            return {label:value, value};
        })
    ]);

    const period = createSelect(["AM","PM"]);

    const setButton = document.createElement("button");
    setButton.className = "btn btn-soft btn-small";
    setButton.textContent = "✓";

    setButton.addEventListener("click", () => {
        if(!isEditor()){
            requireLogin(() => setButton.click());
            return;
        }

        if(!hours.value || !minutes.value){
            alert("Please select the time.\n请选择时间。");
            return;
        }

        const time = `${hours.value}:${minutes.value} ${period.value}`;
        container.replaceWith(createLoggedTime(time));
        saveData();
    });

    manual.append(
        hours,
        document.createTextNode(":"),
        minutes,
        period,
        setButton
    );

    container.append(logButton, manual);
    return container;
}

function createLoggedTime(time){
    const span = document.createElement("span");
    span.className = "time-value";
    span.textContent = time;
    return span;
}

const TEMPERATURE_OPTIONS = Array.from({length:141}, (_, i) => {
    const value = (36 + i / 10).toFixed(1);
    return {label:`${value}°C`, value};
});

function populateTemperatureSelect(select){
    if(!select || select.options.length > 1) return;

    TEMPERATURE_OPTIONS.forEach(item => {
        const option = document.createElement("option");
        option.value = item.value;
        option.textContent = item.label;
        select.appendChild(option);
    });
}

function formatTemperatureTimestamp(timestamp){
    if(!timestamp) return "";
    const date = new Date(timestamp);
    if(Number.isNaN(date.getTime())) return String(timestamp);

    return date.toLocaleString([], {
        day:"2-digit",
        month:"2-digit",
        year:"numeric",
        hour:"numeric",
        minute:"2-digit",
        hour12:true
    });
}

function getTemperatureData(page){
    if(!page) return [];

    return [...page.querySelectorAll(".temperature-entry")].map(entry => ({
        temperature: entry.dataset.temperature || "",
        timestamp: entry.dataset.timestamp || ""
    }));
}

function syncCurrentPageTemperatures(){
    const card = document.querySelector(".temperature-card");
    if(pages[currentPage] && card){
        pages[currentPage]._temperatureData = getTemperatureData(card);
    }
}

function getSavedTemperaturesForPage(page){
    return page?._temperatureData || [];
}

function renderTemperatures(page, temperatures = []){
    const select = page.querySelector(".temperature-select");
    const box = page.querySelector(".temperature-box");

    if(!select || !box) return;

    populateTemperatureSelect(select);
    box.replaceChildren();

    if(!temperatures.length){
        const empty = document.createElement("div");
        empty.className = "temperature-empty";
        empty.textContent = "No temperature recorded yet. / 尚未记录体温。";
        box.appendChild(empty);
        return;
    }

    temperatures.forEach(item => {
        const entry = document.createElement("div");
        entry.className = "temperature-entry";
        entry.dataset.temperature = String(item.temperature ?? "");
        entry.dataset.timestamp = String(item.timestamp ?? "");

        const value = document.createElement("span");
        const temperatureNumber = Number(item.temperature);

        value.className = "temperature-value";
        value.classList.toggle(
            "temperature-high",
            temperatureNumber >= 37.6
        );
        value.textContent = `${temperatureNumber.toFixed(1)}°C`;

        const time = document.createElement("span");
        time.className = "temperature-time";
        time.textContent = formatTemperatureTimestamp(item.timestamp);

        entry.append(value, time);
        box.appendChild(entry);
    });
}

function setupTemperatureSection(page, temperatures = []){
    const temperatureCard = document.querySelector(".temperature-card");
    if(!temperatureCard) return;

    const select = temperatureCard.querySelector(".temperature-select");
    const addButton = temperatureCard.querySelector(".temperature-add-btn");

    populateTemperatureSelect(select);
    renderTemperatures(temperatureCard, temperatures);

    addButton.onclick = () => {
        if(!isEditor()){
            requireLogin(() => addButton.click());
            return;
        }

        if(!select.value){
            alert("Please select a temperature.\n请选择体温。");
            return;
        }

        const temperature = Number(select.value);
        if(Number.isNaN(temperature) || temperature < 36 || temperature > 50){
            alert("Please select a temperature from 36°C to 50°C.\n请选择36°C至50°C之间的体温。");
            return;
        }

        const box = temperatureCard.querySelector(".temperature-box");
        const empty = box.querySelector(".temperature-empty");
        if(empty) empty.remove();

        const timestamp = new Date().toISOString();
        const entry = document.createElement("div");
        entry.className = "temperature-entry";
        entry.dataset.temperature = temperature.toFixed(1);
        entry.dataset.timestamp = timestamp;

        const value = document.createElement("span");
        value.className = "temperature-value";
        value.classList.toggle(
            "temperature-high",
            temperature >= 37.6
        );
        value.textContent = `${temperature.toFixed(1)}°C`;

        const time = document.createElement("span");
        time.className = "temperature-time";
        time.textContent = formatTemperatureTimestamp(timestamp);

        entry.append(value, time);
        box.appendChild(entry);

        select.value = "";
        saveData();
    };
}
function getStartOfToday(){
    const today = new Date();
    today.setHours(0,0,0,0);
    return today;
}

function isPastDatePage(page){
    if(!page) return false;

    const pageDate = new Date(page.dataset.date);
    if(Number.isNaN(pageDate.getTime())) return false;

    pageDate.setHours(0,0,0,0);
    return pageDate.getTime() < getStartOfToday().getTime();
}

function lockPastDatePage(page){
    if(!page) return;

    const locked = isPastDatePage(page);
    page.classList.toggle("past-date-locked", locked);

    // Disable all editing controls on past pages.
    page.querySelectorAll("input, select, button").forEach(control => {
        control.disabled = locked;
    });
}


function updateSelectionToolbar(page){
    if(!page) return;

    const toolbar = page.querySelector(".selection-toolbar");
    const info = page.querySelector(".selection-info");
    if(!toolbar || !info) return;

    const selected = [...selectedRows].filter(row => row && row.isConnected && row.closest(".page") === page);

    if(!selected.length){
        toolbar.classList.remove("show");
        info.innerHTML = "0 selected<br>已选择0行";
        return;
    }

    toolbar.classList.add("show");
    info.innerHTML =
        `${selected.length} selected<br>已选择${selected.length}行`;
}

function clearAllRowSelections(){
    selectedRows.forEach(row => row?.classList?.remove("selected-row"));
    selectedRows.clear();

    pages.forEach(page => updateSelectionToolbar(page));
}

function clearRowSelection(page = pages[currentPage]){
    [...selectedRows].forEach(row => {
        if(!row || !row.isConnected || (page && row.closest(".page") !== page)){
            selectedRows.delete(row);
        }
    });

    if(page){
        page.querySelectorAll("tbody tr.selected-row").forEach(row => {
            if(!selectedRows.has(row)) row.classList.remove("selected-row");
        });
        updateSelectionToolbar(page);
    }
}

function toggleRowSelection(row){
    const page = row?.closest(".page");
    if(!page || page !== pages[currentPage] || isPastDatePage(page) || !isEditor()) return;

    if(selectedRows.has(row)){
        selectedRows.delete(row);
        row.classList.remove("selected-row");
    }else{
        selectedRows.add(row);
        row.classList.add("selected-row");
    }

    updateSelectionToolbar(page);
}

function setupRowSelection(row, page){
    let longPressTimer = null;
    let longPressTriggered = false;

    const cancelLongPress = () => {
        if(longPressTimer){
            clearTimeout(longPressTimer);
            longPressTimer = null;
        }
    };

    row.addEventListener("pointerdown", event => {
        if(event.pointerType === "mouse" && event.button !== 0) return;

        // Do not hijack controls such as selects, checkboxes or buttons.
        if(event.target.closest("select, input, button")) return;

        if(!isEditor() || isPastDatePage(page)) return;

        longPressTriggered = false;
        cancelLongPress();

        longPressTimer = setTimeout(() => {
            longPressTriggered = true;
            suppressRowClickUntil = Date.now() + 700;
            toggleRowSelection(row);

            if(navigator.vibrate) navigator.vibrate(35);
        }, 500);
    });

    row.addEventListener("pointerup", event => {
        cancelLongPress();

        if(event.target.closest("select, input, button")) return;

        if(longPressTriggered){
            longPressTriggered = false;
            return;
        }
    });

    row.addEventListener("pointercancel", cancelLongPress);
    row.addEventListener("pointerleave", event => {
        // Keep touch long-press behavior, but cancel when a mouse leaves the row.
        if(event.pointerType === "mouse") cancelLongPress();
    });

    row.addEventListener("click", event => {
        if(Date.now() < suppressRowClickUntil) return;
        if(event.target.closest("select, input, button")) return;
        toggleRowSelection(row);
    });

    row.addEventListener("contextmenu", event => {
        if(isEditor() && !isPastDatePage(page)){
            event.preventDefault();
            toggleRowSelection(row);
        }
    });
}

function clearSingleRow(row, page){
    const cells = row.cells;
    if(!cells.length) return;

    const timeCell = cells[1];
    const burp = cells[2]?.querySelector("input");
    const milkCell = cells[3];
    const milkSelect = milkCell?.querySelector("select");
    const diaper = cells[4]?.querySelector("select");
    const medicineText = milkCell?.querySelector("span");

    if(timeCell) timeCell.replaceChildren(createTimeControl());
    if(burp) burp.checked = false;
    if(milkSelect) milkSelect.value = "0";
    if(diaper) diaper.value = DIAPER_OPTIONS[0];

    if(milkSelect){
        milkSelect.style.display = "";
        if(medicineText) medicineText.style.display = "none";
    }

    if(cells[2]) cells[2].style.display = "";
    if(cells[3]){
        cells[3].removeAttribute("colspan");
        cells[3].style.display = "";
    }
    if(cells[4]) cells[4].style.display = "";

    applyMedicineMerge(
        row,
        milkSelect,
        burp,
        diaper,
        medicineText
    );
}

function clearSelectedRows(page){
    if(!isEditor() || isPastDatePage(page)) return;

    const selected = [...selectedRows].filter(row =>
        row?.isConnected && row.closest(".page") === page
    );

    if(!selected.length) return;

    if(!confirm(
        `Clear ${selected.length} selected row${selected.length === 1 ? "" : "s"}?` +
        `\n清除已选择的${selected.length}行？`
    )) return;

    selected.forEach(row => clearSingleRow(row, page));

    selected.forEach(row => {
        selectedRows.delete(row);
        row.classList.remove("selected-row");
    });

    updatePageSummary(page);
    updateSelectionToolbar(page);
    saveData();
}

function deleteSelectedRows(page){
    if(!isEditor() || isPastDatePage(page)) return;

    const selected = [...selectedRows].filter(row =>
        row?.isConnected && row.closest(".page") === page
    );

    if(!selected.length) return;

    if(!confirm(
        `Delete ${selected.length} selected row${selected.length === 1 ? "" : "s"}?` +
        `\n删除已选择的${selected.length}行？`
    )) return;

    selected.forEach(row => {
        selectedRows.delete(row);
        row.remove();
    });

    renumberRows(page);
    updatePageSummary(page);
    updateSelectionToolbar(page);
    saveData();
}

function setupSelectionToolbar(page){
    const clearButton = page.querySelector(".selection-clear-btn");
    const deleteButton = page.querySelector(".selection-delete-btn");

    if(clearButton){
        clearButton.addEventListener("click", () => {
            if(!isEditor()){
                requireLogin(() => clearSelectedRows(page));
                return;
            }
            clearSelectedRows(page);
        });
    }

    if(deleteButton){
        deleteButton.addEventListener("click", () => {
            if(!isEditor()){
                requireLogin(() => deleteSelectedRows(page));
                return;
            }
            deleteSelectedRows(page);
        });
    }

    updateSelectionToolbar(page);
}

function setupAddRowButton(page){
    const addButton = page.querySelector(".add-row-btn");
    if(!addButton) return;

    addButton.addEventListener("click", () => {
        if(!isEditor()){
            requireLogin(() => addButton.click());
            return;

function applyMedicineMerge(row, milkSelect, burp, diaper, medicineText = null){
    const isMedicine = milkSelect.value === "medicine";

    if(isMedicine){
        burp.checked = false;
        diaper.value = DIAPER_OPTIONS[0];

        // Show Medicine as plain text instead of the dropdown.
        milkSelect.style.display = "none";
        if(medicineText){
            medicineText.textContent = "Medicine / 药物";
            medicineText.style.display = "inline";
        }

        // Hide Burp and Diaper cells and span the Milk cell across all 3 columns.
        row.cells[2].style.display = "none";
        row.cells[3].colSpan = 3;
        row.cells[4].style.display = "none";
    }else{
        milkSelect.style.display = "";
        if(medicineText) medicineText.style.display = "none";
        row.cells[2].style.display = "";
        row.cells[3].removeAttribute("colspan");
        row.cells[4].style.display = "";
    }
}

function addRowToPage(page, data = {}, shouldSave = true){
    const tbody = page.querySelector("tbody");
    const row = document.createElement("tr");

    const lineCell = document.createElement("td");
    row.appendChild(lineCell);

    const timeCell = document.createElement("td");

    const burp = document.createElement("input");
    burp.type = "checkbox";
    burp.className = "check";
    burp.checked = Boolean(data.burp);

    burp.addEventListener("change", () => {
        if(!isEditor()){
            burp.checked = !burp.checked;
            requireLogin(() => {
                burp.checked = !burp.checked;
                saveData();
            });
            return;
        }
        saveData();
    });

    burpCell.appendChild(burp);
    row.appendChild(burpCell);

    const milkCell = document.createElement("td");
    const medicineText = document.createElement("span");
    medicineText.textContent = "Medicine / 药物";
    medicineText.style.display = "none";
    medicineText.style.fontWeight = "700";

    const milkSelect = createMilkSelect(data.milk ?? "0", () => {
        applyMedicineMerge(row, milkSelect, burp, diaper, medicineText);
        updatePageSummary(page);
        saveData();
    });

    milkCell.append(milkSelect, medicineText);
    row.appendChild(milkCell);

    const diaperCell = document.createElement("td");
    const diaper = createSelect(
        DIAPER_OPTIONS,
        data.diaper || DIAPER_OPTIONS[0]
    );

    diaper.addEventListener("change", () => {
        if(!isEditor()){
            const oldValue = data.diaper || DIAPER_OPTIONS[0];
            diaper.value = oldValue;

            requireLogin(() => {
                diaper.value = oldValue;
                updatePageSummary(page);
                saveData();
            });
            return;
        }

        updatePageSummary(page);
        saveData();
    });

    diaperCell.appendChild(diaper);
    row.appendChild(diaperCell);

    tbody.appendChild(row);

    // Tap/click a row to select it, or long-press/long-tap it on touch devices.
    setupRowSelection(row, page);

    // Apply the merge immediately for saved Medicine rows.

    applyMedicineMerge(row, milkSelect, burp, diaper, medicineText);

    renumberRows(page);
    updatePageSummary(page);
    lockPastDatePage(page);

    if(shouldSave) saveData();
}

function renumberRows(page){
    [...page.querySelectorAll("tbody tr")].forEach((row,index) => {
        row.cells[0].textContent = index + 1;
    });
}

function updatePageSummary(page){
    const milkSelects = page.querySelectorAll(
        "tbody td:nth-child(4) select"
    );

    const diaperSelects = page.querySelectorAll(
        "tbody td:nth-child(5) select"
    );

    const total = [...milkSelects].reduce((sum, select) => {
        return sum + (Number(select.value) || 0);
    }, 0);

    const poopCount = [...diaperSelects]
        .filter(select => select.value === "Poop/大便")
        .length;

    const milkTotal = page.querySelector(".milkTotal");
    const milkGoalReached = total >= 720;

    milkTotal.className = `summary-value milkTotal ${
        milkGoalReached ? "status-success" : "status-warning"
    }`;

    milkTotal.setAttribute(
        "aria-label",
        milkGoalReached
            ? "Milk goal reached: 720 ML or more"
            : "Milk goal not reached: below 720 ML"
    );

    milkTotal.textContent = `${total} ML`;

    page.querySelector(".poopTotal").textContent =
    poopCount === 0
        ? "Pooped 0 time this day. 今天排便0次。"
        : `Pooped ${poopCount} time${poopCount === 1 ? "" : "s"} this day. 今天大便${poopCount}次。`;
}

function updatePageInfo(){
    const current = pages[currentPage];
    if(!current) return;

    current.querySelector(".page-info").innerHTML =
        `Page ${currentPage + 1} of ${pages.length}<br>` +
        `第${currentPage + 1}页，共${pages.length}页`;
}

function showPage(index){
    if(index < 0 || index >= pages.length) return;

    clearAllRowSelections();

    pages.forEach((page,i) => {
        page.style.display = i === index ? "block" : "none";
    });

    currentPage = index;

    updatePageInfo();
    updateNavigation();
    updatePageSummary(pages[currentPage]);
    lockPastDatePage(pages[currentPage]);

    const temperatureCard = document.querySelector(".temperature-card");
    if(temperatureCard){
        renderTemperatures(
            temperatureCard,
            getSavedTemperaturesForPage(pages[currentPage])
        );

        const locked = isPastDatePage(pages[currentPage]);
        temperatureCard.querySelector(".temperature-select").disabled = locked;
        temperatureCard.querySelector(".temperature-add-btn").disabled = locked;
        temperatureCard.classList.toggle("past-date-locked", locked);
    }
}

function normalizePageDatesToToday(){
    if(!pages.length) return false;

    const today = new Date();
    today.setHours(0,0,0,0);

    const lastIndex = pages.length - 1;
    let changed = false;

    pages.forEach((page, index) => {
        const target = new Date(today);
        target.setDate(today.getDate() - (lastIndex - index));

        const targetKey = dateKey(target);

        if(page.dataset.date !== targetKey){
            page.dataset.date = targetKey;
            const dateSpan = page.querySelector(".date-badge span");
            if(dateSpan) dateSpan.textContent = formatDate(target);
            changed = true;
        }
    });

    return changed;
}

function isCurrentDatePage(page){
    if(!page) return false;

    const pageDate = new Date(page.dataset.date);
    const today = new Date();

    pageDate.setHours(0,0,0,0);
    today.setHours(0,0,0,0);

    return pageDate.getTime() === today.getTime();
}

function updateNavigation(){
    $("#prevPageBtn").style.display =
        currentPage === 0 ? "none" : "";

    $("#nextPageBtn").innerHTML =
        currentPage < pages.length - 1
            ? "Next →<br>下一页"
            : "Next Day →<br>下一天";

    // Hide the Last Page button when already on the final page.
    $("#lastPageBtn").style.display =
        currentPage === pages.length - 1 ? "none" : "";

    const addButton = pages[currentPage]?.querySelector(".add-row-btn");
    const isCurrentDate = isCurrentDatePage(pages[currentPage]);

    if(addButton){
        addButton.disabled = !isCurrentDate;
        addButton.textContent = "+";
        addButton.style.opacity = isCurrentDate ? "1" : "0.45";
        addButton.style.cursor = isCurrentDate ? "pointer" : "not-allowed";
    }

    // A past page is read-only, including the page-level delete/clear action.
    const pastPage = isPastDatePage(pages[currentPage]);
    const deletePageButton = $("#deletePageBtn");
    deletePageButton.disabled = pastPage;
    deletePageButton.style.display = pastPage ? "none" : "";
}

function refreshCurrentPage(){
    if(pages[currentPage]){
        updatePageSummary(pages[currentPage]);
    }
}

async function saveData(){
    if(applyingRemote || !isEditor()) return;

    try{
        // Keep the currently visible temperature entries in sync before saving.
        syncCurrentPageTemperatures();

        const data = {
            currentPage,
            pages: pages.map(page => ({
                date: page.dataset.date || dateKey(new Date()),
                rows: getPageRows(page),
                temperatures: getSavedTemperaturesForPage(page)
            }))
        };

        setFirebaseStatus("☁️ Saving...");
        await setDoc(trackerRef, data, { merge: false });
        setFirebaseStatus("☁️ Saved • Firebase connected");
    }catch(error){
        console.error("Firestore save error:", error);
        setFirebaseStatus("❌ Could not save data", true);
    }
}

function getPageRows(page){
    return [...page.querySelectorAll("tbody tr")].map(row => {
        const cells = row.cells;

        const medicineMode = cells[2]?.style.display === "none"
            && cells[3]?.colSpan === 3;

        const milkCell = medicineMode ? cells[3] : cells[3];
        const milkSelect = milkCell?.querySelector("select");

        return {
            time: cells[1]?.querySelector(".time-value")?.textContent || "",
            burp: medicineMode
                ? false
                : Boolean(cells[2]?.querySelector("input")?.checked),
            milk: milkSelect?.value || "0",
            diaper: medicineMode
                ? DIAPER_OPTIONS[0]
                : (cells[4]?.querySelector("select")?.value || DIAPER_OPTIONS[0])
        };
    });
}


function applyRemoteData(saved){
    applyingRemote = true;
    clearAllRowSelections();

    $("#pages").replaceChildren();
    pages = [];

    if(saved?.pages?.length){
        saved.pages.forEach(pageData => {
            createPage(
                pageData.date || dateKey(new Date()),
                pageData.rows || [],
                pageData.temperatures || []
            );
        });

        currentPage = Math.min(
            Number.isInteger(saved.currentPage) ? saved.currentPage : 0,
            pages.length - 1
        );
    }else{
        createPage();
        currentPage = 0;
    }

    // Keep the newest page on today's local calendar date.
    // Older pages become previous days while keeping all their rows/data.
    normalizePageDatesToToday();

    applyingRemote = false;
    showPage(currentPage);
}

function startFirestore(){
    onSnapshot(trackerRef, snapshot => {
        firebaseConnected = true;

        if(snapshot.exists()){
            applyRemoteData(snapshot.data());
            setFirebaseStatus(
                currentUser
                    ? "☁️ Firebase connected • Editing enabled"
                    : "☁️ Firebase connected • View only"
            );
        }else{
            applyingRemote = true;
            $("#pages").replaceChildren();
            pages = [];
            createPage(dateKey(new Date()));
            currentPage = 0;
            applyingRemote = false;
            showPage(0);

            setFirebaseStatus(
                currentUser
                    ? "☁️ Firebase connected • Ready"
                    : "☁️ Firebase connected • View only"
            );
        }
    }, error => {
        console.error("Firestore listener error:", error);
        setFirebaseStatus("❌ Could not connect to Firestore", true);
    });
}

function addNextPage(){
    const lastPage = pages[pages.length - 1];
    const nextDate = new Date(lastPage.dataset.date);

    nextDate.setDate(nextDate.getDate() + 1);

    createPage(dateKey(nextDate));
    showPage(pages.length - 1);
    saveData();
}

function deleteCurrentPage(){
    if(!pages.length) return;

    // Previous dates are permanently read-only after the date has passed.
    if(isPastDatePage(pages[currentPage])) return;

    if(pages.length === 1){
        if(!confirm(
            "Clear all records on this page?\n清除此页面的所有记录？"
        )) return;

        const page = pages[0];

        page.querySelector("tbody").replaceChildren();
        addRowToPage(page, {}, false);

        currentPage = 0;

        showPage(0);
        saveData();
        return;
    }

    if(!confirm(
        "Delete this page and all its records?\n删除此页面及所有记录？"
    )) return;

    const deletedPage = pages[currentPage];

    [...selectedRows].forEach(row => {
        if(row?.closest(".page") === deletedPage) selectedRows.delete(row);
    });

    deletedPage.remove();
    pages.splice(currentPage, 1);

    currentPage = Math.min(currentPage, pages.length - 1);

    showPage(currentPage);
    saveData();
}

$("#prevPageBtn").addEventListener("click", () => {
    showPage(currentPage - 1);

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
});

$("#nextPageBtn").addEventListener("click", () => {
    if(!isEditor()){
        requireLogin(() => $("#nextPageBtn").click());
        return;
    }

    if(currentPage < pages.length - 1){
        showPage(currentPage + 1);
    }else{
        addNextPage();
    }

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
});

$("#lastPageBtn").addEventListener("click", () => {
    if(!isEditor()){
        requireLogin(() => $("#lastPageBtn").click());
        return;
    }

    if(pages.length){
        showPage(pages.length - 1);
    }

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
});

$("#deletePageBtn").addEventListener("click", () => {
    if(!isEditor()){
        requireLogin(() => $("#deletePageBtn").click());
        return;
    }
    deleteCurrentPage();
});

$("#fullscreenBtn").addEventListener("click", async () => {
    if(document.fullscreenElement){
        await document.exitFullscreen();
    }else{
        await document.documentElement.requestFullscreen();
    }
});

document.addEventListener("fullscreenchange", () => {
    $("#fullscreenBtn").textContent =
        document.fullscreenElement ? "✕" : "⛶";
});

startFirestore();
</script>
</body>
</html>
