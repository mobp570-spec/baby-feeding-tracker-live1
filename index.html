<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baby Feeding Tracker</title>

<style>
:root{
    --pink-50:#fff8fa;
    --pink-100:#fff0f4;
    --pink-200:#ffdce7;
    --pink-300:#ffc3d5;
    --pink-400:#ef9db8;
    --pink-500:#dc7197;
    --pink-700:#a84265;
    --ink:#35232b;
    --muted:#8f6f7b;
    --line:#f1d7df;
    --success:#2f9d68;
    --danger:#d95d73;
    --shadow:0 12px 35px rgba(172,81,112,.12);
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100vh;
    width:100%;
    overflow-x:hidden;
    font-family:Arial,sans-serif;
    color:var(--ink);
    background-color:#fff0f4;
    background-image:
        linear-gradient(#ffffff 2px, transparent 3px),
        linear-gradient(90deg, #ffffff 2px, transparent 3px);
    background-size:32px 32px;
}

button,
input,
select{
    font:inherit;
}

.app{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:10px 8px 24px;
}

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:10px;
}

.topbar-left{
    display:flex;
    align-items:center;
    gap:8px;
    flex:none;
}

.icon-btn{
    width:40px;
    height:40px;
    flex:none;
    display:grid;
    place-items:center;
    border:1px solid var(--line);
    border-radius:12px;
    background:rgba(255,255,255,.9);
    color:var(--pink-700);
    cursor:pointer;
    box-shadow:0 4px 14px rgba(172,81,112,.08);
    transition:.2s;
}

.icon-btn:hover{
    transform:translateY(-2px);
    background:var(--pink-50);
}

.brand{
    flex:1;
    text-align:center;
    padding:10px;
    /*border-radius:16px;
    background:rgba(255,255,255,.88);
    box-shadow:var(--shadow);*/
}

.brand h1{
    margin:0;
    font-size:clamp(17px,4vw,27px);
    color:var(--pink-700);
}

.firebase-status{
    text-align:center;
    color:var(--muted);
    font-size:10px;
    padding:5px 10px;
}

.firebase-status.error{
    color:var(--danger);
}

/* =========================================================
   CARD
========================================================= */

.card{
    width:100%;
    background:rgba(255,255,255,.94);
    border:1px solid rgba(241,215,223,.85);
    border-radius:18px;
    box-shadow:var(--shadow);
    overflow:hidden;
}

/* =========================================================
   PAGE
========================================================= */

.page-meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    padding:10px;
    border-bottom:1px solid var(--line);
}

.date-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:7px 9px;
    color:var(--pink-700);
    font-weight:700;
    font-size:12px;
}

.page-info{
    color:var(--muted);
    font-size:11px;
    text-align:right;
}

/* =========================================================
   MAIN FEEDING TABLE
========================================================= */

.table-wrap{
    width:100%;
    overflow:hidden;
}

table{
    width:100%;
    table-layout:fixed;
    border-collapse:collapse;
    border:1px solid var(--line);
}

th:nth-child(1),
td:nth-child(1){
    width:8%;
}

th:nth-child(2),
td:nth-child(2){
    width:28%;
}

th:nth-child(3),
td:nth-child(3){
    width:12%;
}

th:nth-child(4),
td:nth-child(4){
    width:26%;
}

th:nth-child(5),
td:nth-child(5){
    width:26%;
}

th{
    padding:7px 2px;
    background:var(--pink-100);
    color:var(--pink-700);
    font-size:11px;
    line-height:1.25;
    word-break:break-word;
    text-align:center;
    vertical-align:middle;
    border:1px solid var(--line);
}

td{
    padding:6px 2px;
    text-align:center;
    vertical-align:middle;
    font-size:11px;
    overflow:hidden;
    border:1px solid var(--line);
}

tbody tr{
    transition:
        background .18s,
        box-shadow .18s;
}

tbody tr:hover{
    background:#fffafd;
}

select{
    width:100%;
    min-width:0;
    max-width:100%;
    padding:7px 2px;
    border:1px solid var(--pink-300);
    border-radius:8px;
    color:var(--ink);
    background-color:#fff;
    cursor:pointer;
    font-size:11px;
    text-align:center;
}

select:focus,
input:focus{
    outline:none;
    border-color:var(--pink-500);
    box-shadow:0 0 0 3px rgba(220,113,151,.15);
}

.check{
    width:17px;
    height:17px;
    accent-color:var(--pink-500);
    cursor:pointer;
}

/* =========================================================
   TIME
========================================================= */

.time-box{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
}

.manual-time{width:100%;display:flex;align-items:center;justify-content:center;padding:3px;}
.time-picker-open{width:100%;display:flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap;border:1px solid var(--pink-300);border-radius:9px;background:#fff;color:var(--pink-700);padding:7px 4px;font-size:10px;font-weight:800;cursor:pointer;}
.time-picker-open:active{transform:scale(.98);}
.time-picker-modal{position:fixed;inset:0;z-index:100000;display:none;align-items:flex-end;justify-content:center;background:rgba(53,35,43,.38);backdrop-filter:blur(5px);}
.time-picker-modal.show{display:flex;}
.time-picker-sheet{width:min(430px,100%);background:#fff;border-radius:24px 24px 0 0;padding:12px 14px 22px;box-shadow:0 -12px 45px rgba(80,30,50,.25);animation:timePickerUp .22s ease-out;}
@keyframes timePickerUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.time-picker-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.time-picker-title{color:var(--pink-700);font-size:14px;font-weight:800;}
.time-picker-close{border:0;background:transparent;color:var(--muted);font-size:22px;cursor:pointer;padding:2px 6px;}
.time-picker-wheels{position:relative;display:grid;grid-template-columns:1fr 1fr .8fr;gap:3px;height:190px;overflow:hidden;perspective:600px;}
.time-picker-wheels::before{content:"";position:absolute;left:0;right:0;top:50%;height:42px;transform:translateY(-50%);border-top:1px solid var(--pink-300);border-bottom:1px solid var(--pink-300);background:rgba(255,240,244,.65);pointer-events:none;z-index:5;}
.time-picker-wheel{position:relative;height:190px;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,black 22%,black 78%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0%,black 22%,black 78%,transparent 100%);}
.time-picker-wheel:active{cursor:grabbing;}
.time-picker-track{position:absolute;width:100%;left:0;top:0;transform-style:preserve-3d;will-change:transform;}
.time-picker-option{height:38px;display:flex;align-items:center;justify-content:center;color:#b89ca7;font-size:16px;font-weight:600;transform-origin:center center;backface-visibility:hidden;transition:color .12s,font-size .12s,font-weight .12s;}
.time-picker-option.selected{color:var(--pink-700);font-size:19px;font-weight:900;}
.time-box{align-items:center;text-align:center;}
.time-box .time-value{display:flex;width:100%;align-items:center;justify-content:center;text-align:center;line-height:1.25;}
.time-picker-separator{position:absolute;left:33.33%;top:50%;transform:translate(-50%,-50%);z-index:10;color:var(--pink-700);font-size:20px;font-weight:900;pointer-events:none;}
.time-picker-actions{display:flex;gap:7px;margin-top:12px;}
.time-picker-actions button{flex:1;}

.time-value{
    font-weight:700;
    color:var(--pink-700);
    white-space:normal;
    word-break:break-word;
    font-size:11px;
}

/* =========================================================
   MILK / DIAPER
========================================================= */

.feeding-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    width:100%;
}

.feeding-controls .milk-select{
    flex:1 1 55%;
}

.feeding-controls .diaper-select{
    flex:1 1 35%;
}

.feeding-controls .check-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 22px;
}

.feeding-controls.medicine-mode .diaper-select,
.feeding-controls.medicine-mode .check-wrap{
    display:none;
}

.feeding-controls.medicine-mode .milk-select{
    flex:1 1 100%;
}

/* =========================================================
   BUTTONS
   ALL BUTTONS USE THE SAME BACKGROUND
   AS THE ADD ROW BUTTON
========================================================= */

.btn{
    border:0;
    border-radius:9px;
    padding:8px 9px;
    cursor:pointer;
    font-weight:700;
    transition:.2s;
    font-size:11px;
    text-align:center;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn:active{
    transform:translateY(0);
}

/* Same background for every button */

.btn-primary,
.btn-soft,
.btn-danger{
    background:
        linear-gradient(
            135deg,
            var(--pink-500),
            var(--pink-400)
        );
    color:white;
    box-shadow:0 7px 16px rgba(220,113,151,.24);
}

.btn-small{
    padding:5px 4px;
    font-size:9px;
    line-height:1.2;
}

.time-box .btn-small{
    width:100%;
}

/* =========================================================
   INDEPENDENT ADD ROW BUTTON
========================================================= */

.independent-add-row{
    width:100%;
    margin-top:8px;
    padding:0;
}

#addRowOutsideBtn{
    display:block;
    width:100%;
    height:40px;
    margin:0;
    padding:4px;
    border-radius:9px;
    font-size:22px;
    line-height:1;
}

@media(max-width:600px){
    .independent-add-row{
        margin-top:7px;
    }

    #addRowOutsideBtn{
        width:100%;
        height:34px;
        font-size:19px;
    }
}

/* =========================================================
   ROW SELECTION
========================================================= */

tbody tr{
    cursor:pointer;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
}

tbody tr.selected-row{
    background:var(--pink-100);
    box-shadow:
        inset 4px 0 0 var(--pink-500);
}

tbody tr.selected-row td:first-child{
    color:var(--pink-700);
    font-weight:900;
}

.selection-toolbar{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:8px 10px;
    border-top:1px solid var(--line);
    background:
        linear-gradient(
            180deg,
            #fff9fb,
            #fff
        );
}

.selection-toolbar.show{
    display:flex;
}

.selection-info{
    color:var(--pink-700);
    font-size:10px;
    font-weight:800;
    line-height:1.25;
}

.selection-actions{
    display:flex;
    align-items:center;
    gap:6px;
}

.selection-actions .btn{
    min-width:78px;
}

/* =========================================================
   DAILY SUMMARY
========================================================= */

.daily-summary-card{
    margin-top:10px;
}

.daily-summary-section{
    padding:10px;
    background:
        linear-gradient(
            180deg,
            #fff,
            #fff9fb
        );
}

.daily-summary-title{
    text-align:center;
    color:var(--pink-700);
    font-size:12px;
    font-weight:800;
    margin:0 0 8px;
}

.summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    padding:0;
    background:transparent;
}

.summary-item{
    padding:9px;
    border:1px solid var(--line);
    border-radius:12px;
    background:white;
}

.summary-label{
    display:block;
    color:var(--muted);
    font-size:10px;
    margin-bottom:4px;
}

.summary-value{
    font-size:15px;
    font-weight:800;
}

/* =========================================================
   MILK GOAL
========================================================= */

.milkTotal{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    min-width:78px;
    min-height:46px;
    padding:7px 10px;
    border:3px solid var(--danger);
    border-radius:50%;
}

.milkTotal::before{
    content:"✕";
    font-size:17px;
    font-weight:900;
    line-height:1;
}

.milkTotal.status-success{
    color:var(--success);
    border-color:var(--success);
    animation:
        milkSuccessPulse 1.5s ease-in-out infinite;
}

.milkTotal.status-success::before{
    content:"✓";
}

.milkTotal.status-warning{
    color:var(--danger);
    border-color:var(--danger);
    animation:
        milkWarningPulse 1s ease-in-out infinite;
}

@keyframes milkSuccessPulse{
    0%,100%{
        transform:scale(1);
        box-shadow:
            0 0 0 0 rgba(47,157,104,.35);
    }

    50%{
        transform:scale(1.06);
        box-shadow:
            0 0 0 8px rgba(47,157,104,0);
    }
}

@keyframes milkWarningPulse{
    0%,100%{
        transform:scale(1);
        box-shadow:
            0 0 0 0 rgba(217,93,115,.40);
    }

    50%{
        transform:scale(1.08);
        box-shadow:
            0 0 0 10px rgba(217,93,115,0);
    }
}

/* =========================================================
   TEMPERATURE
========================================================= */

.temperature-card{
    margin-top:10px;
}

.temperature-section{
    padding:10px;
    border-top:1px solid var(--line);
    background:
        linear-gradient(
            180deg,
            #fff,
            #fff9fb
        );
}

.temperature-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    margin-bottom:8px;
}

.temperature-select{
    flex:1;
    max-width:210px;
    padding:9px 8px;
    border:1px solid var(--pink-300);
    border-radius:10px;
    background:#fff;
    color:var(--ink);
    font-size:11px;
    text-align:center;
}

.temperature-add-btn{
    flex:0 0 auto;
    width:20%;
}

.temperature-box{
    min-height:40px;
    max-height:220px;
    overflow-y:auto;
    padding:4px 2px;
    background:transparent;
}

.temperature-empty{
    text-align:center;
    color:var(--muted);
    font-size:10px;
    padding:10px 5px;
}

.temperature-entry{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:7px 2px;
    margin-bottom:2px;
    background:transparent;
}

.temperature-entry:last-child{
    margin-bottom:0;
}

.temperature-value{
    color:var(--success);
    font-weight:800;
    font-size:13px;
}

.temperature-value.temperature-high{
    color:var(--danger);
}

.temperature-time{
    color:var(--muted);
    font-size:10px;
    text-align:right;
}

/* =========================================================
   NAVIGATION
========================================================= */

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:6px;
    padding:12px 0 0;
}

.controls .btn{
    flex:1;
    min-width:90px;
}

/* =========================================================
   PAST DATE LOCK
========================================================= */

.page.past-date-locked input,
.page.past-date-locked select,
.page.past-date-locked button{
    pointer-events:none;
    cursor:not-allowed !important;
    opacity:.62;
}

.page.past-date-locked .selection-toolbar{
    display:none !important;
}

.page.past-date-locked .temperature-add-btn{
    display:none;
}

.btn:disabled{
    opacity:.45 !important;
    cursor:not-allowed !important;
    transform:none !important;
    box-shadow:none !important;
}

/* =========================================================
   LOGIN
========================================================= */

.auth-overlay{
    position:fixed;
    inset:0;
    z-index:99999;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:rgba(53,35,43,.45);
    backdrop-filter:blur(4px);
}

.auth-overlay.show{
    display:flex;
}

.auth-box{
    width:min(390px,100%);
    background:#fff;
    border:1px solid var(--line);
    border-radius:20px;
    padding:20px;
    box-shadow:
        0 20px 60px rgba(80,30,50,.25);
}

.auth-box h2{
    margin:0 0 6px;
    text-align:center;
    color:var(--pink-700);
    font-size:21px;
}

.auth-box p{
    margin:0 0 14px;
    text-align:center;
    color:var(--muted);
    font-size:12px;
}

.auth-box label{
    display:block;
    margin:9px 0 5px;
    color:var(--pink-700);
    font-size:11px;
    font-weight:700;
}

.auth-box input{
    width:100%;
    padding:10px;
    border:1px solid var(--pink-300);
    border-radius:10px;
    background:#fff;
}

.auth-actions{
    display:flex;
    gap:7px;
    margin-top:14px;
}

.auth-actions .btn{
    flex:1;
}

.auth-error{
    min-height:18px;
    margin-top:8px;
    color:var(--danger);
    font-size:11px;
    text-align:center;
}

.auth-badge{
    position:fixed;
    right:10px;
    bottom:10px;
    z-index:9998;
    display:none;
    padding:7px 10px;
    border:1px solid var(--line);
    border-radius:12px;
    background:rgba(255,255,255,.96);
    color:var(--pink-700);
    font-size:10px;
    box-shadow:var(--shadow);
    cursor:pointer;
}

.auth-badge.show{
    display:block;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .app{
        padding:6px 4px 18px;
    }

    .topbar{
        gap:5px;
        margin-bottom:7px;
    }

    .topbar-left{
        gap:5px;
    }

    .icon-btn{
        width:34px;
        height:34px;
        border-radius:10px;
    }

    .brand{
        padding:8px 4px;
    }

    .brand h1{
        font-size:16px;
    }

    .card{
        border-radius:13px;
    }

    .page-meta{
        padding:7px;
    }

    .date-badge{
        padding:6px 7px;
        font-size:10px;
    }

    .page-info{
        font-size:9px;
    }

    th{
        padding:6px 1px;
        font-size:9px;
    }

    td{
        padding:5px 1px;
        font-size:9px;
    }

    select{
        padding:5px 0;
        font-size:9px;
        border-radius:6px;
    }

    .check{
        width:15px;
        height:15px;
    }

    .btn{
        font-size:10px;
        padding:7px 5px;
    }

    .btn-small{
        font-size:8px;
        padding:4px 2px;
    }

    .manual-time{padding:2px;}
    .time-picker-sheet{padding:10px 10px 18px;}
    .time-picker-wheels,.time-picker-wheel{height:190px;}
    .time-picker-option{height:38px;font-size:15px;}
    .time-picker-option.selected{font-size:18px;}

    .time-value{
        font-size:9px;
    }

    .time-box{
        gap:3px;
    }

    .summary{
        gap:5px;
    }

    .summary-item{
        padding:7px 5px;
        border-radius:9px;
    }

    .summary-label{
        font-size:9px;
    }

    .summary-value{
        font-size:12px;
    }

    .temperature-controls{
        gap:5px;
    }

    .temperature-select{
        max-width:none;
        font-size:10px;
        padding:8px 4px;
    }

    .temperature-entry{
        padding:7px;
    }

    .temperature-value{
        font-size:12px;
    }

    .temperature-time{
        font-size:9px;
    }

    .selection-toolbar{
        padding:7px;
        gap:5px;
    }

    .selection-info{
        font-size:9px;
    }

    .selection-actions{
        gap:4px;
    }

    .selection-actions .btn{
        min-width:65px;
        padding:6px 4px;
        font-size:9px;
    }

    .controls{
        gap:5px;
        padding-top:9px;
    }

    .controls .btn{
        min-width:0;
        padding:8px 4px;
    }
}

@media(prefers-reduced-motion:reduce){
    .milkTotal{
        animation:none !important;
    }
}
</style>
</head>

<body>

<main class="app">

    <!-- TOP BAR -->
    <div class="topbar">

        <div class="topbar-left">

            <button
                class="icon-btn"
                id="fullscreenBtn"
                title="Fullscreen"
                aria-label="Fullscreen">
                ⛶
            </button>

        </div>

        <div class="brand">

            <h1>
                Baby Feeding Tracker 🍼
                <br>
                婴儿喂养追踪器
            </h1>

        </div>

        <button
            class="icon-btn"
            id="deletePageBtn"
            title="Delete / Clear current page"
            aria-label="Delete or clear current page">
            🗑
        </button>

    </div>

    <div
        class="firebase-status"
        id="firebaseStatus">
        ☁️ Connecting to Firebase...
    </div>

    <!-- MAIN PAGE CARD -->

    <section class="card">

        <div id="pages"></div>

    </section>

    <!-- INDEPENDENT ADD ROW BUTTON -->

    <div class="independent-add-row">

        <button
            class="btn btn-primary"
            id="addRowOutsideBtn"
            type="button"
            title="Add Row / 添加一行"
            aria-label="Add Row / 添加一行">
            +
        </button>

    </div>

    <!-- DAILY SUMMARY -->

function dateKey(

            date

    d.setHours(
        0,
        0,
        0,
        0

    const y =
        d.getFullYear();

const TIME_PICKER_ROW_HEIGHT=38;
let activeTimePicker=null;

function createTimePickerWheel(wheel,track,values,initialIndex=0){
    const state={index:initialIndex,offset:initialIndex*TIME_PICKER_ROW_HEIGHT,startY:0,startOffset:0,dragging:false,velocity:0,lastY:0,lastTime:0};
    track.innerHTML="";
    for(let i=0;i<2;i++){const b=document.createElement("div");b.className="time-picker-option";track.appendChild(b);}
    values.forEach((value,index)=>{const o=document.createElement("div");o.className="time-picker-option";o.textContent=value.label??value;o.dataset.index=index;track.appendChild(o);});
    for(let i=0;i<2;i++){const b=document.createElement("div");b.className="time-picker-option";track.appendChild(b);}
    const clamp=x=>Math.max(0,Math.min(Math.max(0,(values.length-1)*TIME_PICKER_ROW_HEIGHT),x));
    function render(animate=false){
        state.offset=clamp(state.offset);track.style.transition=animate?"transform .22s cubic-bezier(.2,.8,.2,1)":"none";track.style.transform=`translateY(${76-state.offset}px)`;
        track.querySelectorAll(".time-picker-option").forEach((o,i)=>{const n=i-2;if(n<0||n>=values.length){o.style.opacity="0";o.classList.remove("selected");return;}o.style.opacity="1";const d=n*TIME_PICKER_ROW_HEIGHT-state.offset,r=d/TIME_PICKER_ROW_HEIGHT,a=Math.max(-65,Math.min(65,r*22)),sc=Math.max(.72,1-Math.abs(r)*.10);o.style.transform=`perspective(500px) rotateX(${a}deg) scale(${sc})`;o.classList.toggle("selected",Math.abs(r)<.5);});
        state.index=Math.round(state.offset/TIME_PICKER_ROW_HEIGHT);
    }
    function snap(){state.offset=Math.round(state.offset/TIME_PICKER_ROW_HEIGHT)*TIME_PICKER_ROW_HEIGHT;state.offset=clamp(state.offset);render(true);}
    function down(e){e.preventDefault();state.dragging=true;state.startY=e.clientY;state.startOffset=state.offset;state.lastY=e.clientY;state.lastTime=performance.now();wheel.setPointerCapture?.(e.pointerId);}
    function move(e){if(!state.dragging)return;e.preventDefault();const now=performance.now(),dy=e.clientY-state.startY;state.offset=clamp(state.startOffset-dy);const dt=Math.max(1,now-state.lastTime);state.velocity=(e.clientY-state.lastY)/dt;state.lastY=e.clientY;state.lastTime=now;render(false);}
    function up(e){if(!state.dragging)return;state.dragging=false;wheel.releasePointerCapture?.(e.pointerId);state.offset=clamp(state.offset-state.velocity*140);snap();}
    wheel.addEventListener("pointerdown",down);wheel.addEventListener("pointermove",move);wheel.addEventListener("pointerup",up);wheel.addEventListener("pointercancel",up);
    state.setIndex=i=>{state.index=Math.max(0,Math.min(values.length-1,i));state.offset=state.index*TIME_PICKER_ROW_HEIGHT;render(true);};
    state.getValue=()=>values[state.index];render(false);return state;
}

function parseSavedTime(savedTime){

    return{hour:Number(m[1]),minute:Number(m[2]),period:m[3].toUpperCase()};
}

        return String(
            timestamp

    return date.toLocaleString(

        return;

        temperatureCard.querySelector(
            ".temperature-select"
        );


    const addButton =
        temperatureCard.querySelector(
            ".temperature-add-btn"
        );


    populateTemperatureSelect(
        select
    );


    renderTemperatures(
        temperatureCard,
        temperatures
    );


    addButton.onclick =
        () => {

            if(!isEditor()){

                requireLogin(
                    () =>
                        addButton.click()
                );

                return;

            }


            if(!select.value){

                alert(
                    "Please select a temperature.\n请选择体温。"
                );

                return;

            }


            const temperature =
                Number(
                    select.value
                );


            if(
                Number.isNaN(
                    temperature
                ) ||
                temperature < 36 ||
                temperature > 50
            ){

                alert(
                    "Please select a temperature from 36°C to 50°C.\n请选择36°C至50°C之间的体温。"
                );

                return;

            }


            const box =
                temperatureCard.querySelector(
                    ".temperature-box"
                );


            const empty =
                box.querySelector(
                    ".temperature-empty"
                );


            if(empty)
                empty.remove();


            const timestamp =
                new Date()
                .toISOString();


            const entry =
                document.createElement(
                    "div"
                );

            entry.className =
                "temperature-entry";


            entry.dataset.temperature =
                temperature.toFixed(1);


            entry.dataset.timestamp =
                timestamp;


            const value =
                document.createElement(
                    "span"
                );

            value.className =
                "temperature-value";


            value.classList.toggle(
                "temperature-high",
                temperature >= 37.6
            );


            value.textContent =
                `${temperature.toFixed(1)}°C`;


            const time =
                document.createElement(
                    "span"
                );

            time.className =
                "temperature-time";


            time.textContent =
                formatTemperatureTimestamp(
                    timestamp
                );


            entry.append(
                value,
                time
            );


            box.appendChild(
                entry
            );


            select.value =
                "";


            saveData();

        };

}


/* =========================================================
   DATE LOCKING
========================================================= */

function getStartOfToday(){

    const today =
        new Date();

    today.setHours(
        0,
        0,
        0,
        0
    );

    return today;

}


function isPastDatePage(
    page
){

    if(!page)
        return false;


    const pageDate =
        new Date(
            page.dataset.date
        );


    if(
        Number.isNaN(
            pageDate.getTime()
        )
    )
        return false;


    pageDate.setHours(
        0,
        0,
        0,
        0
    );


    return (
        pageDate.getTime() <
        getStartOfToday().getTime()
    );

}


function lockPastDatePage(
    page
){

    if(!page)
        return;


    const locked =
        isPastDatePage(
            page
        );


    page.classList.toggle(
        "past-date-locked",
        locked
    );


    page.querySelectorAll(
        "input, select, button"
    ).forEach(
        control => {

            control.disabled =
                locked;

        }
    );

}


/* =========================================================
   ROW SELECTION
========================================================= */

function updateSelectionToolbar(
    page
){

    if(!page)
        return;


    const toolbar =
        page.querySelector(
            ".selection-toolbar"
        );


    const info =
        page.querySelector(
            ".selection-info"
        );


    if(!toolbar || !info)
        return;


    const selected =
        [
            ...selectedRows
        ].filter(
            row =>
                row &&
                row.isConnected &&
                row.closest(".page") === page
        );


    if(!selected.length){

        toolbar.classList.remove(
            "show"
        );

        info.innerHTML =
            "0 selected<br>已选择0行";

        return;

    }


    toolbar.classList.add(
        "show"
    );


    info.innerHTML =
        `${selected.length} selected<br>` +
        `已选择${selected.length}行`;

}


function clearAllRowSelections(){

    selectedRows.forEach(
        row =>
            row?.classList
                ?.remove(
                    "selected-row"
                )
    );


    selectedRows.clear();


    pages.forEach(
        page =>
            updateSelectionToolbar(
                page
            )
    );

}


function toggleRowSelection(
    row
){

    const page =
        row?.closest(
            ".page"
        );


    if(
        !page ||
        page !== pages[currentPage] ||
        isPastDatePage(page) ||
        !isEditor()
    )
        return;


    if(
        selectedRows.has(
            row
        )
    ){

        selectedRows.delete(
            row
        );

        row.classList.remove(
            "selected-row"
        );

    }else{

        selectedRows.add(
            row
        );

        row.classList.add(
            "selected-row"
        );

    }


    updateSelectionToolbar(
        page
    );

}


function setupRowSelection(
    row,
    page
){

    let longPressTimer =
        null;

    let longPressTriggered =
        false;


    const cancelLongPress =
        () => {

            if(longPressTimer){

                clearTimeout(
                    longPressTimer
                );

                longPressTimer =
                    null;

            }

        };


    row.addEventListener(
        "pointerdown",
        event => {

            if(
                event.pointerType ===
                    "mouse" &&
                event.button !== 0
            )
                return;


            if(
                event.target.closest(
                    "select, input, button"
                )
            )
                return;


            if(
                !isEditor() ||
                isPastDatePage(page)
            )
                return;


            longPressTriggered =
                false;


            cancelLongPress();


            longPressTimer =
                setTimeout(
                    () => {

                        longPressTriggered =
                            true;

                        suppressRowClickUntil =
                            Date.now() + 700;


                        toggleRowSelection(
                            row
                        );


                        if(
                            navigator.vibrate
                        )
                            navigator.vibrate(
                                35
                            );

                    },
                    500
                );

        }
    );


    row.addEventListener(
        "pointerup",
        event => {

            cancelLongPress();


            if(
                event.target.closest(
                    "select, input, button"
                )
            )
                return;


            if(longPressTriggered){

                longPressTriggered =
                    false;

                return;

            }

        }
    );


    row.addEventListener(
        "pointercancel",
        cancelLongPress
    );


    row.addEventListener(
        "pointerleave",
        event => {

            if(
                event.pointerType ===
                "mouse"
            )
                cancelLongPress();

        }
    );


    row.addEventListener(
        "click",
        event => {

            if(
                Date.now() <
                suppressRowClickUntil
            )
                return;


            if(
                event.target.closest(
                    "select, input, button"
                )
            )
                return;


            toggleRowSelection(
                row
            );

        }
    );


    row.addEventListener(
        "contextmenu",
        event => {

            if(
                isEditor() &&
                !isPastDatePage(page)
            ){

                event.preventDefault();

                toggleRowSelection(
                    row
                );

            }

        }
    );

}

   CLEAR / DELETE
========================================================= */

function clearSingleRow(
    row
){

    const cells =
        row.cells;


    if(!cells.length)
        return;


    const timeCell =
        cells[1];


    const burp =
        cells[2]
        ?.querySelector(
            "input"
        );


    const milkCell =
        cells[3];


    const milkSelect =
        milkCell
        ?.querySelector(
            "select"
        );


    const diaper =
        cells[4]
        ?.querySelector(
            "select"
        );


    const medicineText =
        milkCell
        ?.querySelector(
            "span"
        );


    if(timeCell){

        timeCell.replaceChildren(
            createTimeControl()
        );

    }


    if(burp)
        burp.checked = false;


    if(milkSelect)
        milkSelect.value =
            "0";


    if(diaper)
        diaper.value =
            DIAPER_OPTIONS[0];


    if(milkSelect){

        milkSelect.style.display =
            "";

        if(medicineText)
            medicineText.style.display =
                "none";

    }


    if(cells[2])
        cells[2].style.display =
            "";


    if(cells[3]){

        cells[3]
            .removeAttribute(
                "colspan"
            );

        cells[3].style.display =
            "";

    }


    if(cells[4])
        cells[4].style.display =
            "";

}


function clearSelectedRows(
    page
){

    if(
        !isEditor() ||
        isPastDatePage(page)
    )
        return;


    const selected =
        [...selectedRows]
        .filter(
            row =>
                row?.isConnected &&
                row.closest(".page") === page
        );


    if(!selected.length)
        return;


    if(
        !confirm(
            `Clear ${selected.length} selected row${selected.length === 1 ? "" : "s"}?` +
            `\n清除已选择的${selected.length}行？`
        )
    )
        return;


    selected.forEach(
        row =>
            clearSingleRow(
                row
            )
    );


    selected.forEach(
        row => {

            selectedRows.delete(
                row
            );

            row.classList.remove(
                "selected-row"
            );

        }
    );


    updatePageSummary(
        page
    );


    updateSelectionToolbar(
        page
    );


    saveData();

}


function deleteSelectedRows(
    page
){

    if(
        !isEditor() ||
        isPastDatePage(page)
    )
        return;


    const selected =
        [...selectedRows]
        .filter(
            row =>
                row?.isConnected &&
                row.closest(".page") === page
        );


    if(!selected.length)
        return;


    if(
        !confirm(
            `Delete ${selected.length} selected row${selected.length === 1 ? "" : "s"}?` +
            `\n删除已选择的${selected.length}行？`
        )
    )
        return;


    selected.forEach(
        row => {

            selectedRows.delete(
                row
            );

            row.remove();

        }
    );


    renumberRows(
        page
    );


    updatePageSummary(
        page
    );


    updateSelectionToolbar(
        page
    );


    saveData();

}


function setupSelectionToolbar(

){

    const clearButton =
        page.querySelector(

        );


    const deleteButton =
        page.querySelector(

        );

/* =========================================================
   MEDICINE MODE
========================================================= */

function applyMedicineMerge(
    row,
    milkSelect,
    burp,
    diaper,
    medicineText = null
){

    const isMedicine =
        milkSelect.value ===
        "medicine";


    if(isMedicine){

        burp.checked =
            false;


        diaper.value =
            DIAPER_OPTIONS[0];


        milkSelect.style.display =
            "none";


        if(medicineText){

            medicineText.textContent =
                "Medicine / 药物";

            medicineText.style.display =
                "inline";

        }


        row.cells[2]
            .style.display =
            "none";


        row.cells[3]
            .colSpan =
                3;


        row.cells[4]
            .style.display =
                "none";


    }else{

        milkSelect.style.display =
            "";


        if(medicineText)
            medicineText.style.display =
                "none";


        row.cells[2]
            .style.display =
                "";


        row.cells[3]
            .removeAttribute(
                "colspan"
            );


        row.cells[4]
            .style.display =
                "";

    }

}


/* =========================================================
   ADD ROW TO PAGE
========================================================= */

function addRowToPage(
    page,
    data = {},
    shouldSave = true
){

    const tbody =
        page.querySelector(
            "tbody"
        );


    const row =
        document.createElement(
            "tr"
        );


    /* LINE */

    const lineCell =
        document.createElement(
            "td"
        );

    row.appendChild(
        lineCell
    );


    /* TIME */

    const timeCell =
        document.createElement(
            "td"
        );

    timeCell.appendChild(
        createTimeControl(
            data.time || ""
        )
    );

    row.appendChild(
        timeCell
    );


    /* BURP */

    const burpCell =
        document.createElement(
            "td"
        );


    const burp =
        document.createElement(
            "input"
        );

    burp.type =
        "checkbox";

    burp.className =
        "check";

    burp.checked =
        Boolean(
            data.burp
        );


    burp.addEventListener(
        "change",
        () => {

            if(!isEditor()){

                burp.checked =
                    !burp.checked;


                requireLogin(
                    () => {

                        burp.checked =
                            !burp.checked;

                        saveData();

                    }
                );

                return;

            }


            saveData();

        }
    );


    burpCell.appendChild(
        burp
    );


    row.appendChild(
        burpCell
    );


    /* MILK */

    const milkCell =
        document.createElement(
            "td"
        );


    const medicineText =
        document.createElement(
            "span"
        );


    medicineText.textContent =
        "Medicine / 药物";

    medicineText.style.display =
        "none";

    medicineText.style.fontWeight =
        "700";


    let diaper;


    const milkSelect =
        createMilkSelect(
            data.milk ?? "0",
            () => {

                applyMedicineMerge(
                    row,
                    milkSelect,
                    burp,
                    diaper,
                    medicineText
                );

                updatePageSummary(
                    page
                );

                saveData();

            }
        );


    milkCell.append(
        milkSelect,
        medicineText
    );


    row.appendChild(
        milkCell
    );


    /* DIAPER */

    const diaperCell =
        document.createElement(
            "td"
        );


    diaper =
        createSelect(
            DIAPER_OPTIONS,
            data.diaper ||
                DIAPER_OPTIONS[0]
        );


    diaper.className =
        "diaper-select";


    diaper.addEventListener(
        "change",
        () => {

            if(!isEditor()){

                const oldValue =
                    data.diaper ||
                    DIAPER_OPTIONS[0];


                diaper.value =
                    oldValue;


                requireLogin(
                    () => {

                        diaper.value =
                            oldValue;

                        updatePageSummary(
                            page
                        );

                        saveData();

                    }
                );

                return;

            }


            updatePageSummary(
                page
            );


            saveData();

        }
    );


    diaperCell.appendChild(
        diaper
    );


    row.appendChild(
        diaperCell
    );


    tbody.appendChild(
        row
    );


    setupRowSelection(
        row,
        page
    );


    applyMedicineMerge(
        row,
        milkSelect,
        burp,
        diaper,
        medicineText
    );


    renumberRows(
        page
    );


    updatePageSummary(
        page
    );


    lockPastDatePage(
        page
    );


    if(shouldSave)
        saveData();

}

/* =========================================================
   SUMMARY
========================================================= */

function updatePageSummary(
    page
){

    if(!page)
        return;


    const milkSelects =
        page.querySelectorAll(
            "tbody td:nth-child(4) select"
        );


    const diaperSelects =
        page.querySelectorAll(
            "tbody td:nth-child(5) select"
        );


    const total =
        [...milkSelects]
        .reduce(
            (sum,select) =>
                sum +
                (
                    Number(
                        select.value
                    ) || 0
                ),
            0
        );


    const poopCount =
        [...diaperSelects]
        .filter(
            select =>
                select.value ===
                "Poop/大便"
        )
        .length;


    const milkTotal =
        document.querySelector(
            "#dailyMilkTotal"
        );


    const poopTotal =
        document.querySelector(
            "#dailyPoopTotal"
        );


    const milkGoalReached =
        total >= 720;


    if(milkTotal){

        milkTotal.className =
            `summary-value milkTotal ${
                milkGoalReached
                    ? "status-success"
                    : "status-warning"
            }`;


        milkTotal.textContent =
            `${total} ML`;

    }


    if(poopTotal){

        poopTotal.textContent =
            poopCount === 0

                ? "Pooped 0 time this day. 今天排便0次。"

                : `Pooped ${poopCount} time${
                    poopCount === 1
                        ? ""
                        : "s"
                  } this day. 今天大便${poopCount}次。`;

    }

}

    current.querySelector(

/* =========================================================
   SHOW PAGE
========================================================= */

function showPage(
    index
){

    if(
        index < 0 ||
        index >= pages.length
    )
        return;


    clearAllRowSelections();


    pages.forEach(
        (page,i) => {

            page.style.display =
                i === index
                    ? "block"
                    : "none";

        }
    );


    currentPage =
        index;


    updatePageInfo();

    updateNavigation();

    updatePageSummary(
        pages[currentPage]
    );

    lockPastDatePage(
        pages[currentPage]
    );


    const temperatureCard =
        document.querySelector(
            ".temperature-card"
        );


    if(temperatureCard){

        renderTemperatures(
            temperatureCard,
            getSavedTemperaturesForPage(
                pages[currentPage]
            )
        );

            isPastDatePage(
                pages[currentPage]
            );

            .querySelector(
                ".temperature-select"
            )
            .disabled =
                locked;


        temperatureCard
            .querySelector(
                ".temperature-add-btn"
            )
            .disabled =
                locked;


        temperatureCard
            .classList
            .toggle(
                "past-date-locked",
                locked
            );

    }

}


/* =========================================================
   NORMALIZE DATES
========================================================= */

function normalizePageDatesToToday(){

    if(!pages.length)
        return false;


    const today =
        new Date();


    today.setHours(
        0,
        0,
        0,
        0
    );


    const lastIndex =
        pages.length - 1;


    let changed =
        false;


    pages.forEach(
        (page,index) => {

            const target =
                new Date(
                    today
                );


            target.setDate(
                today.getDate() -
                (
                    lastIndex -
                    index
                )
            );


            const targetKey =
                dateKey(
                    target
                );


            if(
                page.dataset.date !==
                targetKey
            ){

                page.dataset.date =
                    targetKey;


                const dateSpan =
                    page.querySelector(
                        ".date-badge span"
                    );


                if(dateSpan)
                    dateSpan.textContent =
                        formatDate(
                            target
                        );


                changed =
                    true;

            }

        }
    );


    return changed;

}


/* =========================================================
   CURRENT DATE
========================================================= */

function isCurrentDatePage(
    page
){

    if(!page)
        return false;


    const pageDate =
        new Date(
            page.dataset.date
        );


    const today =
        new Date();


    pageDate.setHours(
        0,
        0,
        0,
        0
    );


    today.setHours(
        0,
        0,
        0,
        0
    );


    return (
        pageDate.getTime() ===
        today.getTime()
    );

}


/* =========================================================
   NAVIGATION
========================================================= */

function updateNavigation(){

    $("#prevPageBtn")
        .style.display =
            currentPage === 0
                ? "none"
                : "";


    $("#nextPageBtn")
        .innerHTML =

        currentPage <
        pages.length - 1

            ? "Next →<br>下一页"

            : "Next Day →<br>下一天";


    $("#lastPageBtn")
        .style.display =

        currentPage ===
        pages.length - 1

            ? "none"
            : "";


    const addButton =
        $("#addRowOutsideBtn");


    const isCurrentDate =
        isCurrentDatePage(
            pages[currentPage]
        );


    if(addButton){

        addButton.disabled =
            !isCurrentDate;


        addButton.textContent =
            "+";


        addButton.style.opacity =
            isCurrentDate
                ? "1"
                : "0.45";


        addButton.style.cursor =
            isCurrentDate
                ? "pointer"
                : "not-allowed";

    }


    const pastPage =
        isPastDatePage(
            pages[currentPage]
        );


    const deletePageButton =
        $("#deletePageBtn");


    deletePageButton.disabled =
        pastPage;


    deletePageButton.style.display =
        pastPage
            ? "none"
            : "";

}


/* =========================================================
   REFRESH
========================================================= */

function refreshCurrentPage(){

    if(
        pages[currentPage]
    ){

        updatePageSummary(
            pages[currentPage]
        );

    }

}


/* =========================================================
   FIREBASE SAVE
========================================================= */

async function saveData(){

    if(
        applyingRemote ||
        !isEditor()
    )
        return;


    try{

        syncCurrentPageTemperatures();


        const data = {

            currentPage,

            pages:
                pages.map(
                    page => ({

                        date:
                            page.dataset.date ||
                            dateKey(
                                new Date()
                            ),

                        rows:
                            getPageRows(
                                page
                            ),

                        temperatures:
                            getSavedTemperaturesForPage(
                                page
                            )

                    })
                )

        };


        setFirebaseStatus(
            "☁️ Saving..."
        );


        await setDoc(
            trackerRef,
            data,
            {
                merge:false
            }
        );


        setFirebaseStatus(
            "☁️ Saved • Firebase connected"
        );


    }catch(error){

        console.error(
            "Firestore save error:",
            error
        );


        setFirebaseStatus(
            "❌ Could not save data",
            true
        );

    }

}


/* =========================================================
   GET ROW DATA
========================================================= */

function getPageRows(
    page
){

    return [
        ...page.querySelectorAll(
            "tbody tr"
        )
    ].map(
        row => {

            const cells =
                row.cells;


            const medicineMode =
                cells[2]?.style.display ===
                    "none" &&

                cells[3]?.colSpan ===
                    3;


            const milkCell =
                cells[3];


            const milkSelect =
                milkCell
                    ?.querySelector(
                        "select"
                    );


            return {

                time:
                    cells[1]
                        ?.querySelector(
                            ".time-value"
                        )
                        ?.textContent ||
                    "",


                burp:
                    medicineMode
                        ? false
                        : Boolean(
                            cells[2]
                                ?.querySelector(
                                    "input"
                                )
                                ?.checked
                        ),


                milk:
                    milkSelect
                        ?.value ||
                    "0",


                diaper:
                    medicineMode

                        ? DIAPER_OPTIONS[0]

                        : (
                            cells[4]
                                ?.querySelector(
                                    "select"
                                )
                                ?.value ||
                            DIAPER_OPTIONS[0]
                        )

            };

        }
    );

}


/* =========================================================
   APPLY REMOTE FIREBASE DATA
========================================================= */

function applyRemoteData(
    saved
){

    applyingRemote =
        true;


    clearAllRowSelections();


    $("#pages")
        .replaceChildren();


    pages = [];


    if(
        saved?.pages?.length
    ){

        saved.pages.forEach(
            pageData => {

                createPage(

                    pageData.date ||
                        dateKey(
                            new Date()
                        ),

                    pageData.rows ||
                        [],

                    pageData.temperatures ||
                        []

                );

            }
        );


        currentPage =
            Math.min(

                Number.isInteger(
                    saved.currentPage
                )
                    ? saved.currentPage
                    : 0,

                pages.length - 1

            );

    }else{

        createPage();

        currentPage =
            0;

    }


    normalizePageDatesToToday();


    applyingRemote =
        false;


    showPage(
        currentPage
    );

}


/* =========================================================
   FIRESTORE LISTENER
========================================================= */

function startFirestore(){

    onSnapshot(
        trackerRef,

        snapshot => {

            firebaseConnected =
                true;


            if(
                snapshot.exists()
            ){

                applyRemoteData(
                    snapshot.data()
                );


                setFirebaseStatus(

                    currentUser

                        ? "☁️ Firebase connected • Editing enabled"

                        : "☁️ Firebase connected • View only"

                );

            }else{

                applyingRemote =
                    true;


                $("#pages")
                    .replaceChildren();


                pages = [];


                createPage(
                    dateKey(
                        new Date()
                    )
                );


                currentPage =
                    0;


                applyingRemote =
                    false;


                showPage(
                    0
                );


                setFirebaseStatus(

                    currentUser

                        ? "☁️ Firebase connected • Ready"

                        : "☁️ Firebase connected • View only"

                );

            }

        },

        error => {

            console.error(
                "Firestore listener error:",
                error
            );


            setFirebaseStatus(
                "❌ Could not connect to Firestore",
                true
            );

        }
    );

}


/* =========================================================
   NEXT PAGE
========================================================= */

function addNextPage(){

    const lastPage =
        pages[
            pages.length - 1
        ];


    const nextDate =
        new Date(
            lastPage.dataset.date
        );


    nextDate.setDate(
        nextDate.getDate() + 1
    );


    createPage(
        dateKey(
            nextDate
        )
    );


    showPage(
        pages.length - 1
    );


    saveData();

}


/* =========================================================
   DELETE CURRENT PAGE
========================================================= */

function deleteCurrentPage(){

    if(!pages.length)
        return;


    if(
        isPastDatePage(
            pages[currentPage]
        )
    )
        return;


    if(
        pages.length === 1
    ){

        if(
            !confirm(
                "Clear all records on this page?\n清除此页面的所有记录？"
            )
        )
            return;


        const page =
            pages[0];


        page.querySelector(
            "tbody"
        ).replaceChildren();


        addRowToPage(
            page,
            {},
            false
        );


        currentPage =
            0;


        showPage(
            0
        );


        saveData();


        return;

    }


    if(
        !confirm(
            "Delete this page and all its records?\n删除此页面及所有记录？"
        )
    )
        return;


    const deletedPage =
        pages[currentPage];


    [
        ...selectedRows
    ].forEach(
        row => {

            if(
                row?.closest(
                    ".page"
                ) ===
                deletedPage
            ){

                selectedRows.delete(
                    row
                );

            }

        }
    );


    deletedPage.remove();


    pages.splice(
        currentPage,
        1
    );


    currentPage =
        Math.min(
            currentPage,
            pages.length - 1
        );


    showPage(
        currentPage
    );


    saveData();

}


/* =========================================================
   NAV BUTTONS
========================================================= */

$("#prevPageBtn")
    .addEventListener(
        "click",
        () => {

            showPage(
                currentPage - 1
            );


            window.scrollTo(
                {
                    top:0,
                    behavior:"smooth"
                }
            );

        }
    );


$("#nextPageBtn")
    .addEventListener(
        "click",
        () => {

            if(!isEditor()){

                requireLogin(
                    () =>
                        $("#nextPageBtn")
                            .click()
                );

                return;

            }


            if(
                currentPage <
                pages.length - 1
            ){

                showPage(
                    currentPage + 1
                );

            }else{

                addNextPage();

            }


            window.scrollTo(
                {
                    top:0,
                    behavior:"smooth"
                }
            );

        }
    );


$("#lastPageBtn")
    .addEventListener(
        "click",
        () => {

            if(!isEditor()){

                requireLogin(
                    () =>
                        $("#lastPageBtn")
                            .click()
                );

                return;

            }


            if(pages.length){

                showPage(
                    pages.length - 1
                );

            }


            window.scrollTo(
                {
                    top:0,
                    behavior:"smooth"
                }
            );

        }
    );


/* =========================================================
   DELETE PAGE
========================================================= */

$("#deletePageBtn")
    .addEventListener(
        "click",
        () => {

            if(!isEditor()){

                requireLogin(
                    () =>
                        $("#deletePageBtn")
                            .click()
                );

                return;

            }


            deleteCurrentPage();

        }
    );


/* =========================================================
   FULLSCREEN
========================================================= */

$("#fullscreenBtn")
    .addEventListener(
        "click",
        async () => {

            if(
                document.fullscreenElement
            ){

                await document.exitFullscreen();

            }else{

                await document
                    .documentElement
                    .requestFullscreen();

            }

        }
    );


document.addEventListener(
    "fullscreenchange",
    () => {

        $("#fullscreenBtn")
            .textContent =
                document.fullscreenElement
                    ? "✕"
                    : "⛶";

    }
);


document.querySelector("#timePickerClose").addEventListener("click",()=>{if(activeTimePicker)activeTimePicker.close();});
document.querySelector("#timePickerCancel").addEventListener("click",()=>{if(activeTimePicker)activeTimePicker.close();});
document.querySelector("#timePickerConfirm").addEventListener("click",()=>{if(activeTimePicker)activeTimePicker.confirm();});
document.querySelector("#timePickerModal").addEventListener("click",event=>{if(event.target.id==="timePickerModal"&&activeTimePicker)activeTimePicker.close();});

/* =========================================================
   START
========================================================= */

setupIndependentAddRowButton();

startFirestore();

</script>

</body>
